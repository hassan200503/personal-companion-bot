name: Companion CI

on:
  push:
    paths:
      - "companion/**"
      - ".github/workflows/companion-ci.yml"
  pull_request:
    paths:
      - "companion/**"
      - ".github/workflows/companion-ci.yml"

jobs:
  verify:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: companion
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify
